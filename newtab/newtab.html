<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zwire</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="app" id="app">
    <div class="crt-scanline"></div>
    <div class="crt-scanline-v"></div>

    <main class="hud">
      <header class="brand">
        <span class="brand-mark">ZW</span>
        <span class="brand-word">ZWIRE</span>
        <span class="brand-tag">// CHROMIUM · SUPERSET</span>
      </header>

      <!-- Speed Dial groups; position + visibility come from the active layout -->
      <nav id="ntp-nav" class="ntp-nav" aria-label="speed dial groups"></nav>

      <!-- the active group's widget grid: clock, search, dials, lists, webpages -->
      <section id="ntp-grid" class="ntp-grid" aria-label="widgets"></section>

      <!-- layout switcher · groups · widget picker · customize · edit -->
      <footer id="ntp-bar" class="ntp-bar"></footer>
    </main>
  </div>

  <!-- layout model (shared verbatim with the HUD extension) -->
  <script src="zntp-core.js"></script>
  <!-- widget bodies, then the renderer that drives them -->
  <script src="widgets.js"></script>
  <script src="newtab.js"></script>
  <script src="schemes.js"></script>
  <script src="scheme-sync.js"></script>
  <!-- tmux pane forwarder: only active when this NTP is framed as a tmux pane -->
  <script src="tmux-pane.js"></script>
  <!-- ⌘K / : command palette (zgui-core), self-contained for the new tab -->
  <script src="lib/zgui/util.js"></script>
  <script src="lib/zgui/fzf.js"></script>
  <script src="lib/zgui/command-palette.js"></script>
  <!-- dialogs + drag for the inline layout editor (zgui-core copies) -->
  <script src="lib/zgui-core/webui/modal.js"></script>
  <script src="lib/zgui-core/webui/toast.js"></script>
  <script src="lib/zgui-core/webui/drag.js"></script>
  <script src="layout-edit.js"></script>
  <script src="cmd-defaults.js"></script>
  <script src="palette-cmds.js"></script>
  <script src="palette.js"></script>
</body>
</html>
